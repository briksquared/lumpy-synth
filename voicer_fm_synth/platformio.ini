[platformio]
default_envs = blackpill_f411ce
src_dir = .

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
board_build.core = stm32
upload_protocol = dfu
monitor_speed = 115200
lib_deps = https://github.com/pschatzmann/Arduino-STK.git
build_src_filter = +<*> -<build/> -<.pio/>
