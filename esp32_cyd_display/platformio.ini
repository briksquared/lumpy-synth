; LUMPY SYNTH companion UI for ESP32-2432S028R (Cheap Yellow Display)
; ILI9341 240x320 + XPT2046 resistive touch

[env:cyd]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -DCYD_PILL_TX=27
    -DCYD_PILL_RX=22
    -DCYD_UART_BAUD=115200
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
